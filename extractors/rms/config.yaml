type: remote

cognite:
    host: ${CDF_URL}
    project: ${CDF_PROJECT}

    idp-authentication:
        token-url: ${IDP_TOKEN_URL}
        client-id: ${IDP_CLIENT_ID}
        secret: ${IDP_CLIENT_SECRET}
        scopes:
            - ${CDF_URL}/.default

    extraction-pipeline:
        external-id: "ep_rms_ingestion"

raw:
    database: ${CDF_RAW_DB}
    table: ${CDF_RAW_STATE_TABLE}

rms:
    db:
        # Current: SQLite file on the VM. Set this to its absolute path.
        # PostgreSQL transition: set RMS_DB_URL to the SQLAlchemy URL documented in README.md.
        url: ${RMS_DB_URL}
        batch_size: 500
    raw_database: ${CDF_RAW_DB}
    table_names:
        - risk_master
        - risk_cycle
        - risk_action
    raw_key_fields:
        risk_master: risk_id
        risk_cycle: cycle_id
        risk_action: action_id
